[project]
name = "conver-cell-detection"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anndata>=0.13.4",
    "harmonypy>=2.1.0",
    "igraph>=1.0.0",
    "leidenalg>=0.12.0",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "scanpy>=1.12.4",
    "scikit-image>=0.26.0",
    "seaborn>=0.13.2",
    "spatialdata>=0.8.0",
    "spatialdata-io>=0.7.1",
    "spatialdata-plot>=0.4.2",
    "squidpy>=1.8.3",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
]
